<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="400" viewBox="0 0 1280 400" role="img" aria-labelledby="t d">
  <title id="t">Kaisa</title>
  <desc id="d">Run coding agents safely. You only see work that has already passed verification.</desc>
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0A1120"/>
      <stop offset="0.6" stop-color="#101C33"/>
      <stop offset="1" stop-color="#16123A"/>
    </linearGradient>
    <linearGradient id="aurora" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5EEAD4"/>
      <stop offset="0.5" stop-color="#2DD4BF"/>
      <stop offset="1" stop-color="#8B7CF6"/>
    </linearGradient>
    <linearGradient id="ribbonA" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#2DD4BF" stop-opacity="0.55"/>
      <stop offset="0.8" stop-color="#8B7CF6" stop-opacity="0.45"/>
      <stop offset="1" stop-color="#8B7CF6" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="ribbonB" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#34D399" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#34D399" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#5EEAD4" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-10%" y="-60%" width="120%" height="220%"><feGaussianBlur stdDeviation="18"/></filter>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="8" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1280" height="400" fill="url(#sky)"/>
  <g filter="url(#soft)">
    <path d="M-40 120 C220 40 420 170 700 90 C900 34 1080 120 1320 50" fill="none" stroke="url(#ribbonA)" stroke-width="46"/>
    <path d="M-40 190 C260 120 520 230 820 150 C1000 104 1160 170 1320 130" fill="none" stroke="url(#ribbonB)" stroke-width="36"/>
  </g>
  <g fill="#E6F1F5" opacity="0.55">
    <circle cx="1060" cy="60" r="1.6"/><circle cx="1180" cy="110" r="1.2"/><circle cx="980" cy="300" r="1.3"/>
    <circle cx="560" cy="48" r="1.1"/><circle cx="760" cy="330" r="1.4"/><circle cx="1220" cy="270" r="1.1"/>
    <circle cx="420" cy="350" r="1.2"/><circle cx="1120" cy="350" r="1.5"/><circle cx="880" cy="40" r="1.2"/>
  </g>
  <g transform="translate(96 72) scale(0.5)">
    <path d="M256 84 L404 148 V272 C404 356 340 414 256 446 C172 414 108 356 108 272 V148 Z" fill="#2DD4BF" fill-opacity="0.10" stroke="url(#aurora)" stroke-width="16" stroke-linejoin="round"/>
    <g stroke-linecap="round" stroke-linejoin="round" fill="none">
      <line x1="200" y1="176" x2="200" y2="356" stroke="#E6F1F5" stroke-width="34"/>
      <line x1="214" y1="270" x2="306" y2="178" stroke="#E6F1F5" stroke-width="34"/>
      <polyline points="226,288 270,338 352,236" stroke="url(#aurora)" stroke-width="34" filter="url(#glow)"/>
    </g>
  </g>
  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
    <text x="380" y="178" font-size="104" font-weight="800" fill="#E6F1F5" letter-spacing="-2">Kaisa</text>
    <text x="384" y="230" font-size="30" font-weight="500" fill="#B9CCD8">Run coding agents safely.</text>
    <text x="384" y="270" font-size="30" font-weight="500" fill="#B9CCD8">See only work that already passed verification.</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="20">
    <rect x="384" y="300" width="640" height="44" rx="10" fill="#0A1120" fill-opacity="0.75" stroke="#2DD4BF" stroke-opacity="0.35"/>
    <text x="404" y="329" fill="#5EEAD4">$</text>
    <text x="428" y="329" fill="#E6F1F5">kaisa "fix the flaky date test"</text>
    <text x="842" y="329" fill="#2DD4BF">→ verified ✓</text>
  </g>
</svg>
