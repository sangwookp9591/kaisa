[package]
name = "kaisa-cli"
description = "Kaisa command-line and TUI front end."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[dependencies]
kaisa-agents.workspace = true
kaisa-context.workspace = true
kaisa-daemon.workspace = true
kaisa-domain.workspace = true
kaisa-ledger.workspace = true
kaisa-sys.workspace = true
kaisa-mcp.workspace = true
kaisa-workspace.workspace = true
toml = "0.8"

serde_json.workspace = true
crossterm.workspace = true
ratatui.workspace = true

[target.'cfg(unix)'.dependencies]
signal-hook.workspace = true

[features]
# Test fixtures that must never exist in a shipped binary (for example the MCP server's
# goal-argument hook). Off by default; only `bin/kaisa`'s dev-dependency turns it on, and with
# resolver 3 dev-dependency features apply only to builds of test targets.
test-hooks = []

[lints]
workspace = true
