[package]
name = "kaisa-sys"
description = "The only Kaisa crate allowed to contain `unsafe`: PTYs, process handles, job objects, sandboxes."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

# Mirrors [workspace.lints] except `unsafe_code`, which is `deny` here so that each
# `unsafe` block must be explicitly allowed and carry a `SAFETY:` comment.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
unreachable_pub = "warn"

[lints.clippy]
wildcard_imports = "deny"
enum_glob_use = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"
