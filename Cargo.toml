[workspace]
resolver = "3"
members = [
    "bin/kaisa",
    "crates/kaisa-agents",
    "crates/kaisa-cli",
    "crates/kaisa-context",
    "crates/kaisa-daemon",
    "crates/kaisa-domain",
    "crates/kaisa-egress",
    "crates/kaisa-fake-agent",
    "crates/kaisa-keeper",
    "crates/kaisa-ledger",
    "crates/kaisa-mcp",
    "crates/kaisa-protocol",
    "crates/kaisa-supervisor",
    "crates/kaisa-sys",
    "crates/kaisa-workspace",
]

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
license = "MIT"
repository = "https://github.com/sangwookp9591/kaisa"
publish = false

[workspace.dependencies]
kaisa-agents = { path = "crates/kaisa-agents" }
kaisa-cli = { path = "crates/kaisa-cli" }
kaisa-daemon = { path = "crates/kaisa-daemon" }
kaisa-context = { path = "crates/kaisa-context" }
kaisa-domain = { path = "crates/kaisa-domain" }
kaisa-egress = { path = "crates/kaisa-egress" }
kaisa-keeper = { path = "crates/kaisa-keeper" }
kaisa-ledger = { path = "crates/kaisa-ledger" }
kaisa-mcp = { path = "crates/kaisa-mcp" }
kaisa-protocol = { path = "crates/kaisa-protocol" }
kaisa-supervisor = { path = "crates/kaisa-supervisor" }
kaisa-sys = { path = "crates/kaisa-sys" }
kaisa-workspace = { path = "crates/kaisa-workspace" }

blake3 = { version = "1.8.7", default-features = false, features = ["std"] }
crossterm = { version = "0.29.0", default-features = false, features = ["events", "windows"] }
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm_0_29"] }
libc = "0.2.191"
rusqlite = { version = "0.41.1", features = ["bundled"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
windows-sys = { version = "0.61.2", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_Security_Cryptography",
    "Win32_Security_Isolation",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_IO",
    "Win32_System_JobObjects",
    "Win32_System_Pipes",
    "Win32_System_Threading",
] }

# Lints shared by every crate except `kaisa-sys`, which declares its own copy with
# `unsafe_code = "deny"` (the only crate allowed to opt into `unsafe`, architecture §13).
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
unreachable_pub = "warn"

[workspace.lints.clippy]
# Google Rust style guide: no glob imports; prefer `expect` over `unwrap`.
wildcard_imports = "deny"
enum_glob_use = "deny"
unwrap_used = "deny"
dbg_macro = "deny"
todo = "deny"
undocumented_unsafe_blocks = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"
