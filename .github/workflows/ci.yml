name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# Every commit on main gets its own group (and so its own CI result). Pull requests share a
# group per branch, so a new push cancels the superseded run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.ref || github.sha }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: -D warnings

jobs:
  # Format, lint and test on all three release platforms (architecture §8, §16).
  check:
    name: check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install pinned toolchain (rust-toolchain.toml)
        run: rustup show active-toolchain || rustup toolchain install
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
      - name: Offline installer tests (macOS/Linux)
        if: runner.os != 'Windows'
        shell: sh
        run: |
          scripts/test-install.sh
      - name: ShellCheck installers
        if: runner.os == 'Linux'
        run: shellcheck scripts/install.sh scripts/test-install.sh
      - name: Offline installer tests (PowerShell 5.1)
        if: runner.os == 'Windows'
        shell: powershell
        run: scripts/test-install.ps1
      - name: Offline installer tests (pwsh)
        if: runner.os == 'Windows'
        shell: pwsh
        run: scripts/test-install.ps1
      - name: rustfmt
        run: cargo fmt --all --check
      - name: clippy
        run: cargo clippy --workspace --all-targets --locked
      - name: build the test-only fake agent (end-to-end tests run it as a process)
        run: cargo build --locked -p kaisa-fake-agent
      - name: test
        run: cargo test --workspace --locked --no-fail-fast
      - name: smoke-run the binary
        shell: bash
        run: |
          cargo run --locked -q -p kaisa -- --version
          set +e
          cargo run --locked -q -p kaisa -- review
          status=$?
          set -e
          test "$status" -eq 2 || { echo "expected exit 2 for an unimplemented command, got $status"; exit 1; }

  # Google Rust style guide import rules need nightly-only rustfmt options.
  fmt-imports:
    name: rustfmt import granularity (nightly)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install nightly rustfmt
        run: rustup toolchain install nightly --profile minimal -c rustfmt
      - name: rustfmt --check (imports_granularity=Module)
        run: cargo +nightly fmt --all -- --check --config imports_granularity=Module,group_imports=StdExternalCrate

  # Dependency evidence gate: licenses, bans, sources and advisories (architecture §14).
  deny:
    name: cargo-deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2.1.1
