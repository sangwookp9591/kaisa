# cargo-deny configuration (architecture §14: dependency evidence gate).
#
# The licence allow-list only contains licences actually present in the dependency
# graph. Add a licence when a reviewed dependency needs it, not in advance.

[licenses]
allow = ["MIT", "Apache-2.0"]
confidence-threshold = 0.9

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace crates are `publish = false` path dependencies without a version.
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
